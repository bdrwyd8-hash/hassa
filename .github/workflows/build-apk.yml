name: Build & Release Android APK

on:
  push:
    branches: [ "**" ]
  release:
    types: [ published, created, edited ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Debug Keystore for CI Signing
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI build..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Binary
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TrailKit-Studio-v1.0.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrailKit-Studio-v1.0-APK
          path: TrailKit-Studio-v1.0.apk

      - name: Attach APK to GitHub Release
        run: |
          gh release upload "1.0.0" TrailKit-Studio-v1.0.apk --clobber || true
          gh release upload "v1.0.0" TrailKit-Studio-v1.0.apk --clobber || true
          if [ -n "${{ github.ref_name }}" ]; then
            gh release upload "${{ github.ref_name }}" TrailKit-Studio-v1.0.apk --clobber || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
